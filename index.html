<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Clock Worksheet Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <script src="scripts/jquery-2.2.4.min.js"></script>
    <script src="scripts/anoClock.js"></script>
    <script src="scripts/random.js"></script>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<header class="site-header no-print">
    <div class="brand">
        <div class="logo-clock" aria-hidden="true">
            <div class="logo-hand logo-minute"></div>
            <div class="logo-hand logo-hour"></div>
        </div>
        <h1>Clock Worksheet Generator</h1>
    </div>
    <p class="byline">by <a href="https://jefamirault.com">Jef Amirault</a></p>
</header>

<form class="control-bar no-print" id="config-panel" onsubmit="return false;">
    <label class="control" for="config-interval">
        <span class="control-label">Times to the nearest</span>
        <select id="config-interval">
            <option value="60" selected>Hour</option>
            <option value="30">Half hour</option>
            <option value="15">Quarter hour</option>
            <option value="5">5 minutes</option>
            <option value="1">Minute</option>
        </select>
    </label>
    <label class="control control-check">
        <input type="checkbox" id="config-answers" checked> Answer Key
    </label>
    <label class="control control-check">
        <input type="checkbox" id="config-colors" checked> Color
    </label>
    <label class="control control-check">
        <input type="checkbox" id="config-numbers" checked> Problem numbers
    </label>
    <label class="control control-check" title="Every problem on the sheet gets a different time">
        <input type="checkbox" id="config-unique" checked> Prevent duplicates
    </label>
    <label class="control" for="config-seed">
        <span class="control-label">Seed</span>
        <input type="number" id="config-seed" placeholder="random" title="Same seed, same worksheet">
        <button type="button" class="btn btn-chalk" id="reset-seed" title="Clear the seed and generate a new random worksheet">Randomize</button>
    </label>
    <span class="control-actions">
        <button type="button" class="btn btn-pencil" id="bookmark-worksheet" title="Put this worksheet's seed and settings in the URL so it can be bookmarked or shared">Save Worksheet</button>
        <button type="button" class="btn btn-chalk" id="print-worksheet">Print</button>
    </span>
    <div class="saved-row" id="saved-row">
        <div class="saved-tools" id="saved-tools"></div>
        <span class="saved-eyebrow">Saved</span>
        <div class="saved-list" id="saved-list"></div>
    </div>
</form>

<main class="paper">
    <div class="answer-badge" id="answer-badge" hidden>Answer key</div>
    <div class="sheet-header">
        <div class="fill-line fill-name">Name</div>
        <div class="fill-line fill-date">Date</div>
    </div>
    <div class="sheet-title-row">
        <h2 class="sheet-title">Telling time</h2>
        <p class="sheet-instructions" id="sheet-instructions">Write the time shown on each clock.</p>
    </div>
    <div class="clock-grid">
        <div class="clock-cell">
            <span class="problem-number">1.</span>
            <div class="clock-container">
                <div class="clock1"></div>
            </div>
            <input class="time-input" aria-label="Time for clock 1">
        </div>
        <div class="clock-cell">
            <span class="problem-number">2.</span>
            <div class="clock-container">
                <div class="clock2"></div>
            </div>
            <input class="time-input" aria-label="Time for clock 2">
        </div>
        <div class="clock-cell">
            <span class="problem-number">3.</span>
            <div class="clock-container">
                <div class="clock3"></div>
            </div>
            <input class="time-input" aria-label="Time for clock 3">
        </div>
        <div class="clock-cell">
            <span class="problem-number">4.</span>
            <div class="clock-container">
                <div class="clock4"></div>
            </div>
            <input class="time-input" aria-label="Time for clock 4">
        </div>
        <div class="clock-cell">
            <span class="problem-number">5.</span>
            <div class="clock-container">
                <div class="clock5"></div>
            </div>
            <input class="time-input" aria-label="Time for clock 5">
        </div>
        <div class="clock-cell">
            <span class="problem-number">6.</span>
            <div class="clock-container">
                <div class="clock6"></div>
            </div>
            <input class="time-input" aria-label="Time for clock 6">
        </div>
        <div class="clock-cell">
            <span class="problem-number">7.</span>
            <div class="clock-container">
                <div class="clock7"></div>
            </div>
            <input class="time-input" aria-label="Time for clock 7">
        </div>
        <div class="clock-cell">
            <span class="problem-number">8.</span>
            <div class="clock-container">
                <div class="clock8"></div>
            </div>
            <input class="time-input" aria-label="Time for clock 8">
        </div>
        <div class="clock-cell">
            <span class="problem-number">9.</span>
            <div class="clock-container">
                <div class="clock9"></div>
            </div>
            <input class="time-input" aria-label="Time for clock 9">
        </div>
    </div>
    <p class="sheet-meta" id="sheet-meta"></p>
</main>

<footer class="site-footer no-print">
    <p>Reload or press Randomize for a fresh set of clocks.
        Analog clock plugin by <a href="https://codepen.io/andrewsheffield/full/qZedNE">Andrew Sheffield</a>.</p>
</footer>

<script src="scripts/script.js"></script>

</body>
</html>
