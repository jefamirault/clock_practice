<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Clock Worksheet Generator</title>
    <script src="scripts/jquery-2.2.4.min.js"></script>
    <script src="scripts/bootstrap.min.js"></script>
    <script src="scripts/anoClock.js"></script>
    <script src="scripts/random.js"></script>
    <link rel="stylesheet" href="styles/bootstrap.min.css">
    <link rel="stylesheet" href="styles/animate.min.css">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">



<div class="container">
    <div class="row">
        <div class="col-xs-12">
            <h1>Clock Worksheet Generator</h1>
            <h3>By <a href="https://jefamirault.com">Jef Amirault</a></h3>
            <h5>jQuery plugin by Andrew Sheffield</h5>
        </div>
    </div>
</div>



<div class="container no-print">
    <div class="row">
        <div class="col-xs-12">
            <form class="form-inline" id="config-panel" onsubmit="return false;">
                <div class="form-group">
                    <label for="config-interval">Times to nearest</label>
                    <select id="config-interval" class="form-control">
                        <option value="60" selected>Hour</option>
                        <option value="30">Half hour</option>
                        <option value="15">Quarter hour</option>
                        <option value="5">5 minutes</option>
                        <option value="1">Minute</option>
                    </select>
                </div>
                <div class="checkbox">
                    <label><input type="checkbox" id="config-answers"> Show answers</label>
                </div>
                <div class="checkbox">
                    <label><input type="checkbox" id="config-colors"> Colored clocks</label>
                </div>
                <div class="form-group">
                    <label for="config-seed">Seed</label>
                    <input type="number" id="config-seed" class="form-control" placeholder="random">
                </div>
                <button type="button" class="btn btn-primary" id="new-worksheet">New Worksheet</button>
            </form>
        </div>
    </div>
</div>

<div class="container">
    <div class="row">
        <div class="col-sm-4 top-examples">
            <div class="clock-container">
                <div class="clock1"></div>
            </div>
            <input class="time-input">
        </div>
        <div class="col-sm-4 top-examples">
            <div class="clock-container">
                <div class="clock2"></div>
            </div>
            <input class="time-input">
        </div>
        <div class="col-sm-4 top-examples">
            <div class="clock-container">
                <div class="clock3"></div>
            </div>
            <input class="time-input">
        </div>
    </div>
</div>

<div class="container">
    <div class="row">
        <div class="col-sm-4 time-zone">
            <div class="clock-container">
                <div class="clock4"></div>
            </div>
            <input class="time-input">
        </div>
        <div class="col-sm-4 time-zone">
            <div class="clock-container">
                <div class="clock5"></div>
            </div>
            <input class="time-input">
        </div>
        <div class="col-sm-4 time-zone">
            <div class="clock-container">
                <div class="clock6"></div>
            </div>
            <input class="time-input">
        </div>
    </div>
</div>

<div class="container">
    <div class="row">
        <div class="col-sm-4 time-zone">
            <div class="clock-container">
                <div class="clock7"></div>
            </div>
            <input class="time-input">
        </div>
        <div class="col-sm-4 time-zone">
            <div class="clock-container">
                <div class="clock8"></div>
            </div>
            <input class="time-input">
        </div>
        <div class="col-sm-4 time-zone">
            <div class="clock-container">
                <div class="clock9"></div>
            </div>
            <input class="time-input">
        </div>
    </div>
</div>


<script src="scripts/script.js"></script>

</body>
</html>
